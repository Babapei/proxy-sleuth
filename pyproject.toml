[project]
name = "proxy-sleuth"
version = "0.1.0"
description = "Detect fake LLM APIs — multi-layer verification to catch proxy services substituting cheaper models"
requires-python = ">=3.9"
license = {text = "MIT"}
readme = "README.md"
authors = [
    {name = "proxy-sleuth contributors"}
]
keywords = ["llm", "api", "proxy", "detection", "fingerprinting", "fraud-detection"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "click>=8.1",
    "httpx>=0.27",
    "rich>=13.0",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
]

[project.scripts]
proxy-sleuth = "src.main:cli"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["src", "src.analyzers", "src.detectors", "src.utils"]

[tool.setuptools.package-data]
src = ["data/prompts/*.json", "vendor/fingerprint/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
